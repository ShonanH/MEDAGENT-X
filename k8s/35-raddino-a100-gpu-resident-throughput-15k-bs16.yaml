apiVersion: batch/v1
kind: Job
metadata:
  name: medagentx-raddino-a100-gpu-resident-throughput-15k-bs16-v1
  labels:
    app.kubernetes.io/name: medagentx
    app.kubernetes.io/component: vision-throughput-gate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: raddino-throughput-gate
          image: shonanmedagentx/medagentx:2026-10-27-raddino-gpu-cache-v1
          imagePullPolicy: Always
          command:
            - python
            - -m
            - medagentx.cli.benchmark_raddino_gpu_resident
          args:
            - --cohort-root
            - /data/chexpert-plus/cohorts/label-enriched-15k-v1
            - --model-ready-cache-root
            - /data/chexpert-plus/cohorts/label-enriched-15k-v1/raddino-model-ready-v1
            - --batch-size
            - '16'
            - --steps
            - '500'
            - --trainable-last-blocks
            - '1'
            - --progress-every-steps
            - '25'
          env:
            - name: HF_HOME
              value: /data/cache/huggingface
            - name: TORCH_HOME
              value: /data/cache/torch
            - name: PYTHONUNBUFFERED
              value: '1'
          resources:
            requests:
              cpu: '4'
              memory: '16Gi'
              ephemeral-storage: '60Gi'
              nvidia.com/a100: 1
            limits:
              cpu: '4'
              memory: '16Gi'
              ephemeral-storage: '60Gi'
              nvidia.com/a100: 1
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: medagentx-data
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
