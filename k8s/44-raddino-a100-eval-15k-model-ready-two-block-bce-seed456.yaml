apiVersion: batch/v1
kind: Job
metadata:
  name: medagentx-rad-a100-15k-mr-2b16-bce-s456-test-v1
  labels:
    app.kubernetes.io/name: medagentx
    app.kubernetes.io/component: vision-evaluation
    app.kubernetes.io/experiment: two-block-model-ready-bs16-bce-seed456-test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 604800
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: raddino-test-evaluation
          image: shonanmedagentx/medagentx:2026-10-28-raddino-gpu-cache-v5
          imagePullPolicy: Always
          command: [python, -m, medagentx.cli.evaluate_raddino_checkpoint]
          args:
            - --cohort-root
            - /data/chexpert-plus/cohorts/label-enriched-15k-v1
            - --model-ready-cache-root
            - /data/chexpert-plus/cohorts/label-enriched-15k-v1/raddino-model-ready-v1
            - --checkpoint
            - /runs/medagentx/training/raddino-a100-15k-model-ready-two-block-bs16-bce-seed456-v1/best_checkpoint.pt
            - --output-root
            - /runs/medagentx/evaluation/raddino-a100-15k-model-ready-two-block-bs16-bce-seed456-test-v1
            - --device
            - cuda
            - --batch-size
            - '16'
          env:
            - name: HF_HOME
              value: /data/cache/huggingface
            - name: TORCH_HOME
              value: /data/cache/torch
            - name: PYTHONUNBUFFERED
              value: '1'
          resources:
            requests: {cpu: '4', memory: 16Gi, ephemeral-storage: 60Gi, nvidia.com/a100: 1}
            limits: {cpu: '4', memory: 16Gi, ephemeral-storage: 60Gi, nvidia.com/a100: 1}
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
            - {name: runs, mountPath: /runs}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: medagentx-data}
        - name: runs
          persistentVolumeClaim: {claimName: medagentx-runs}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
