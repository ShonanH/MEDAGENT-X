apiVersion: v1
kind: Pod
metadata:
  name: medagentx-phase1-cpu
  labels:
    app.kubernetes.io/name: medagentx
    app.kubernetes.io/component: phase1-evaluation
spec:
  activeDeadlineSeconds: 604800
  restartPolicy: Never

  imagePullSecrets:
    - name: dockerhub-pull

  containers:
    - name: workspace
      image: shonanmedagentx/medagentx:2026-10-28-raddino-gpu-cache-v5
      imagePullPolicy: Always
      command: [sh, -c, 'sleep 604800']

      env:
        - name: HF_HOME
          value: /data/cache/huggingface
        - name: TORCH_HOME
          value: /data/cache/torch
        - name: PYTHONUNBUFFERED
          value: '1'

      resources:
        requests:
          cpu: '4'
          memory: 16Gi
          ephemeral-storage: 40Gi
        limits:
          cpu: '4'
          memory: 16Gi
          ephemeral-storage: 40Gi

      volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
        - name: runs
          mountPath: /runs
        - name: dshm
          mountPath: /dev/shm

  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: medagentx-data
    - name: runs
      persistentVolumeClaim:
        claimName: medagentx-runs
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
