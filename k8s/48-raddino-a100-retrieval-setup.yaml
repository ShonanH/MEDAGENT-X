apiVersion: v1
kind: Pod
metadata:
  name: medagentx-retrieval-a100
  labels:
    app.kubernetes.io/name: medagentx
    app.kubernetes.io/component: retrieval-index
spec:
  activeDeadlineSeconds: 604800
  restartPolicy: Never

  imagePullSecrets:
    - name: dockerhub-pull

  containers:
    - name: workspace
      image: shonanmedagentx/medagentx:2026-10-28-raddino-gpu-cache-v5
      imagePullPolicy: Always
      command: [sh, -c, "sleep 604800"]

      env:
        - name: HF_HOME
          value: /data/cache/huggingface
        - name: TORCH_HOME
          value: /data/cache/torch
        - name: PYTHONUNBUFFERED
          value: "1"

      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          ephemeral-storage: 60Gi
          nvidia.com/a100: 1
        limits:
          cpu: "4"
          memory: 16Gi
          ephemeral-storage: 60Gi
          nvidia.com/a100: 1

      volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
        - name: runs
          mountPath: /runs
        - name: dshm
          mountPath: /dev/shm

  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: medagentx-data
    - name: runs
      persistentVolumeClaim:
        claimName: medagentx-runs
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
