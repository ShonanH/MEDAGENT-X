apiVersion: batch/v1
kind: Job
metadata:
  name: medagentx-raddino-benchmark-v1
  labels:
    app.kubernetes.io/name: medagentx
    app.kubernetes.io/component: training-benchmark
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  ttlSecondsAfterFinished: 604800

  template:
    spec:
      restartPolicy: Never

      imagePullSecrets:
        - name: dockerhub-pull

      containers:
        - name: raddino-benchmark
          image: shonanmedagentx/medagentx:2026-10-16-r2
          imagePullPolicy: IfNotPresent

          command:
            - python
            - -m
            - medagentx.cli.train_raddino

          args:
            - --cohort-root
            - /data/chexpert-plus/cohorts/label-enriched-15k-v1
            - --output-root
            - /runs/medagentx/benchmarks/raddino-512-v1
            - --device
            - cuda
            - --batch-size
            - '2'
            - --gradient-accumulation-steps
            - '4'
            - --epochs
            - '1'
            - --num-workers
            - '2'
            - --max-train-studies
            - '512'
            - --max-val-studies
            - '128'
            - --max-test-studies
            - '128'

          env:
            - name: HF_HOME
              value: /data/cache/huggingface
            - name: TORCH_HOME
              value: /data/cache/torch
            - name: PYTHONUNBUFFERED
              value: '1'

          resources:
            requests:
              cpu: '4'
              memory: '16Gi'
              ephemeral-storage: '60Gi'
              nvidia.com/gpu: 1
            limits:
              cpu: '4'
              memory: '16Gi'
              ephemeral-storage: '60Gi'
              nvidia.com/gpu: 1

          volumeMounts:
            - name: data
              mountPath: /data
            - name: runs
              mountPath: /runs

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: medagentx-data
        - name: runs
          persistentVolumeClaim:
            claimName: medagentx-runs
